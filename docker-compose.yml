version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: college_socket_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: college_socket_db
      MYSQL_USER: college_user
      MYSQL_PASSWORD: college_pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u college_user --password=college_pass123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - college_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_socket_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: college_socket_db
      DB_USER: college_user
      DB_PASSWORD: college_pass123
      JWT_SECRET: college_socket_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 24h
      AUTO_SEED: "true"
      DEBUG: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - college_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_socket_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - college_network

volumes:
  mysql_data:
    driver: local

networks:
  college_network:
    driver: bridge
